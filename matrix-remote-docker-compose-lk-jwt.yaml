# Add this service to matrix-remote/docker-compose.yaml on the Pi
# (merge under services:, e.g. after livekit and before element-call)

  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    container_name: matrix-lk-jwt
    restart: unless-stopped
    environment:
      - LIVEKIT_URL=wss://matrixrtc.310networks.com/livekit/sfu
      - LIVEKIT_KEY=matrix
      - LIVEKIT_SECRET=your-livekit-secret-here  # must match the key in livekit/livekit.yaml (never commit the real secret)
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=matrix.310networks.com
    ports:
      - "8070:8080"
    networks:
      - matrix
    depends_on:
      - livekit
